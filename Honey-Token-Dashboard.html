<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Honey Token Dashboard</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    padding:30px;
    margin:0;
}

h1,h3{
    margin-top:0;
}

.main-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
    gap:20px;
}

.events-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:10px;
}

.card h3{
    color:#ffffff;
    margin-bottom:14px;
}

.list{
    background:#0b1220;
    padding:14px;
    border-radius:8px;
    max-height:420px;
    overflow:auto;
}

.item{
    padding:12px;
    border-bottom:1px solid #2b3548;
    font-size:14px;
    margin-bottom:10px;
    background:#07101f;
    border-radius:8px;
}

.empty{
    color:#94a3b8;
}

.top-card{
    margin-bottom:20px;
}

.mini-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
    margin-top:10px;
}

.mini-stat{
    background:#0b1220;
    border-radius:8px;
    padding:12px;
}

.mini-stat-label{
    color:#94a3b8;
    font-size:12px;
    margin-bottom:6px;
}

.mini-stat-value{
    font-size:20px;
    font-weight:bold;
    word-break:break-word;
}

.section-title{
    color:#93c5fd;
    font-size:18px;
    font-weight:bold;
    margin-bottom:14px;
}
</style>
</head>

<body>

<h1>SSC Honeytoken Events Dashboard</h1>

<div class="card top-card">
    <div class="mini-grid">
        <div class="mini-stat">
            <div class="mini-stat-label">Total Events</div>
            <div class="mini-stat-value" id="total">0</div>
        </div>
        <div class="mini-stat">
            <div class="mini-stat-label">Top Attacker IP</div>
            <div class="mini-stat-value" id="topip">-</div>
        </div>
        <div class="mini-stat">
            <div class="mini-stat-label">Most Targeted Token</div>
            <div class="mini-stat-value" id="toptoken">-</div>
        </div>
    </div>
</div>

<div id="eventsGrid" class="events-grid"></div>

<div class="main-grid">

    <div class="card">
        <h3>Top Attacking IPs</h3>
        <div id="ips" class="list"></div>
    </div>

    <div class="card">
        <h3>Tokens Activity</h3>
        <div id="tokens" class="list"></div>
    </div>

    <div class="card">
        <h3>Stages (CI/CD)</h3>
        <div id="stages" class="list"></div>
    </div>

    <div class="card">
        <h3>Timeline</h3>
        <div id="timeline" class="list"></div>
    </div>

</div>

<script>
async function load(){
    try{
        const r = await fetch("CTI_Storage/events.json?t=" + Date.now());
        const data = await r.json();

        document.getElementById("total").textContent = data.length;

        renderGroupedEvents(data);
        renderTopIPs(data);
        renderTokens(data);
        renderStages(data);
        renderTimeline(data);
    }catch(err){
        console.error(err);
    }
}

function renderGroupedEvents(data){
    let container = document.getElementById("eventsGrid");
    container.innerHTML = "";

    const grouped = {};

    data.forEach(e=>{
        Object.entries(e).forEach(([k,v])=>{
            if(!grouped[k]) grouped[k] = new Set();
            grouped[k].add(String(v));
        });
    });

    Object.entries(grouped).forEach(([k,values])=>{
        let card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="section-title">${k}</div>
            ${[...values].map(v=>`<div>${v}</div>`).join("")}
        `;

        container.appendChild(card);
    });
}

function renderTopIPs(data){
    let map = {};

    data.forEach(e=>{
        const ip = e.ip || e.source_ip;
        if(ip){
            map[ip] = (map[ip] || 0) + 1;
        }
    });

    let sorted = Object.entries(map).sort((a,b)=>b[1]-a[1]);

    let p = document.getElementById("ips");
    p.innerHTML = "";

    if(sorted.length === 0){
        p.innerHTML = `<div class="item empty">No IP data</div>`;
        return;
    }

    sorted.forEach(i=>{
        p.innerHTML += `<div class="item">${i[0]} → ${i[1]}</div>`;
    });

    document.getElementById("topip").textContent = sorted[0][0];
}

function renderTokens(data){
    let map = {};

    data.forEach(e=>{
        const token = e.token || e.token_id;
        if(token){
            map[token] = (map[token] || 0) + 1;
        }
    });

    let sorted = Object.entries(map).sort((a,b)=>b[1]-a[1]);

    let p = document.getElementById("tokens");
    p.innerHTML = "";

    if(sorted.length === 0){
        p.innerHTML = `<div class="item empty">No token activity</div>`;
        return;
    }

    sorted.forEach(t=>{
        p.innerHTML += `<div class="item">${t[0]} → ${t[1]}</div>`;
    });

    document.getElementById("toptoken").textContent = sorted[0][0];
}

function renderStages(data){
    let map = {};

    data.forEach(e=>{
        // 🔥 التعديل هنا
        const stage = e.stage || e.event_type || "unknown";
        map[stage] = (map[stage] || 0) + 1;
    });

    let p = document.getElementById("stages");
    p.innerHTML = "";

    Object.entries(map).forEach(s=>{
        p.innerHTML += `<div class="item">${s[0]} → ${s[1]}</div>`;
    });
}

function renderTimeline(data){
    let p = document.getElementById("timeline");
    p.innerHTML = "";

    data.slice().reverse().forEach(e=>{
        const ts = e.timestamp || "-";
        const ip = e.ip || "-";

        // 🔥 التعديل هنا
        const type = e.event_type || e.method || "event";

        p.innerHTML += `
            <div class="item">
                ${ts} → ${ip}<br>
                (${type})
                ${e.bucket ? `<br>Bucket: ${e.bucket}` : ""}
            </div>
        `;
    });
}

load();
setInterval(load, 5000);
</script>

</body>
</html>
