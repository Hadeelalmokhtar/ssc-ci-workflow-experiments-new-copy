<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HoneyToken Dashboard</title>
<style>
body {
    background: #0f172a;
    color: white;
    font-family: Arial;
    padding: 30px;
    margin: 0;
}
 
h1, h3 { margin-top: 0; }
 
.top-card {
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}
 
.mini-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-top: 10px;
}
 
.mini-stat {
    background: #0b1220;
    border-radius: 8px;
    padding: 12px;
}
 
.mini-stat-label {
    color: #94a3b8;
    font-size: 12px;
    margin-bottom: 6px;
}
 
.mini-stat-value {
    font-size: 20px;
    font-weight: bold;
    word-break: break-word;
}
 
.mini-stat-value.red   { color: #f87171; }
.mini-stat-value.amber { color: #fbbf24; }
.mini-stat-value.teal  { color: #34d399; }
.mini-stat-value.blue  { color: #60a5fa; }
 
.main-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 20px;
    margin-bottom: 20px;
}
 
.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
}
 
.card h3 {
    color: #ffffff;
    margin-bottom: 14px;
}
 
.list {
    background: #0b1220;
    padding: 14px;
    border-radius: 8px;
    max-height: 420px;
    overflow: auto;
}
 
.item {
    padding: 12px;
    border-bottom: 1px solid #2b3548;
    font-size: 13px;
    margin-bottom: 8px;
    background: #07101f;
    border-radius: 8px;
    line-height: 1.7;
}
 
.item:last-child { margin-bottom: 0; border-bottom: none; }
 
.empty { color: #94a3b8; font-size: 13px; }
 
.badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: bold;
    margin: 2px 2px 0 0;
    vertical-align: middle;
}
.badge-red    { background: #501313; color: #f87171; }
.badge-amber  { background: #412402; color: #fbbf24; }
.badge-teal   { background: #04342c; color: #34d399; }
.badge-purple { background: #26215c; color: #a78bfa; }
.badge-blue   { background: #042c53; color: #60a5fa; }
.badge-gray   { background: #1e293b; color: #94a3b8; border: 1px solid #2b3548; }
 
.kv {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 3px;
    align-items: flex-start;
}
.kv-k { color: #64748b; min-width: 130px; font-size: 12px; flex-shrink: 0; padding-top: 1px; }
.kv-v { color: #e2e8f0; font-size: 12px; word-break: break-all; flex: 1; }
 
.intel-block {
    background: #0b1220;
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 8px;
    border: 1px solid #2b3548;
}
 
.intel-title {
    color: #93c5fd;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: .05em;
}
 
.section-title {
    color: #93c5fd;
    font-size: 11px;
    font-weight: bold;
    margin: 10px 0 6px;
    text-transform: uppercase;
    letter-spacing: .05em;
}
 
.bundle-header {
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}
.bundle-header:hover { opacity: .85; }
.bundle-body { display: none; margin-top: 12px; }
.bundle-body.open { display: block; }
.arrow { font-size: 11px; color: #64748b; transition: transform .2s; margin-left: auto; }
.arrow.open { transform: rotate(90deg); }
 
.bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
    font-size: 12px;
}
.bar-label { color: #94a3b8; width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
.bar-track { flex: 1; height: 10px; background: #07101f; border-radius: 5px; overflow: hidden; }
.bar-fill  { height: 100%; border-radius: 5px; }
.bar-count { color: #64748b; width: 24px; text-align: right; flex-shrink: 0; }
 
.divider { border: none; border-top: 1px solid #2b3548; margin: 10px 0; }
 
.filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.fbtn {
    font-size: 11px; padding: 4px 12px; border-radius: 20px;
    border: 1px solid #2b3548; background: #0b1220;
    color: #94a3b8; cursor: pointer; font-family: Arial;
}
.fbtn:hover { background: #1e293b; }
.fbtn.active { background: #042c53; color: #60a5fa; border-color: #185FA5; font-weight: bold; }
 
.nested { border-left: 2px solid #2b3548; padding-left: 10px; margin: 4px 0; }
 
.list::-webkit-scrollbar { width: 4px; }
.list::-webkit-scrollbar-track { background: transparent; }
.list::-webkit-scrollbar-thumb { background: #2b3548; border-radius: 2px; }
 
.mono { font-family: 'Courier New', monospace; font-size: 11px; color: #94a3b8; white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow: auto; }
</style>
</head>
<body>
 
<h1>HoneyToken Dashboard</h1>
<p style="color:#64748b;margin-top:-10px;margin-bottom:20px;font-size:13px" id="subTitle">Loading CTI_Storage/CTI_STIX.json …</p>
 
<!-- Metrics -->
<div class="top-card">
    <div class="mini-grid">
        <div class="mini-stat">
            <div class="mini-stat-label">Total Hits</div>
            <div class="mini-stat-value blue" id="mTotal">0</div>
        </div>
        <div class="mini-stat">
            <div class="mini-stat-label">Unique IPs</div>
            <div class="mini-stat-value teal" id="mIPs">0</div>
        </div>
        <div class="mini-stat">
            <div class="mini-stat-label">High Confidence</div>
            <div class="mini-stat-value red" id="mHigh">0</div>
        </div>
        <div class="mini-stat">
            <div class="mini-stat-label">TOR / VPN</div>
            <div class="mini-stat-value amber" id="mTor">0</div>
        </div>
        <div class="mini-stat">
            <div class="mini-stat-label">Top Attacker IP</div>
            <div class="mini-stat-value" style="font-size:13px" id="mTopIP">—</div>
        </div>
        <div class="mini-stat">
            <div class="mini-stat-label">Most Triggered HoneyTokens</div>
            <div class="mini-stat-value" style="font-size:13px" id="mTopEP">—</div>
        </div>
    </div>
</div>
 
<!-- Row 1: charts + IPs -->
<div class="main-grid">
    <div class="card">
        <h3>Activity by HoneyToken</h3>
        <div id="chartEndpoint"></div>
    </div>
    <div class="card">
        <h3>Hits by Country</h3>
        <div id="chartCountry"></div>
    </div>
    <div class="card">
        <h3>Top Attacking IPs</h3>
        <div class="list" id="listIPs"></div>
    </div>
</div>
 
<!-- Row 2: Timeline same level as other cards -->
<div class="main-grid">
    <div class="card">
        <h3>Timeline</h3>
        <div class="list" id="listTimeline"></div>
    </div>
</div>
 
<!-- All bundles -->
<div class="card">
    <h3>All Bundles</h3>
    <div class="filter-bar" id="filterBar"></div>
    <div class="list" id="listBundles"></div>
</div>
 
<script>
// ============================================================
// STATE
// ============================================================
var allBundles = [];
var activeFilter = 'all';
 
var FILTERS = [
    { k:'all',     label:'All' },
    { k:'high',    label:'High Confidence' },
    { k:'tor',     label:'TOR' },
    { k:'vpn',     label:'VPN' },
    { k:'scanner', label:'Scanner' },
    { k:'s3',      label:'S3 Probe' },
    { k:'config',  label:'Config Probe' },
    { k:'cred',    label:'Credential Misuse' },
];
 
// ============================================================
// UTILS
// ============================================================
function esc(s) {
    return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
 
function fmtTs(ts) {
    if (!ts) return '—';
    try {
        return new Date(ts).toLocaleString(undefined,
            { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    } catch(e) { return ts; }
}
 
function chipColor(label) {
    var l = (label || '').toLowerCase();
    if (l.includes('malicious') || l.includes('tor') || l.includes('danger')) return 'badge-red';
    if (l.includes('vpn') || l.includes('scanner') || l.includes('bot') || l.includes('cloud')) return 'badge-amber';
    if (l.includes('honeypot') || l.includes('intel') || l.includes('raw') || l.includes('geo')) return 'badge-teal';
    if (l.includes('actor') || l.includes('abuse') || l.includes('virus')) return 'badge-purple';
    if (l.includes('network') || l.includes('traffic')) return 'badge-blue';
    return 'badge-gray';
}
 
function scoreBadge(key, val) {
    var k = (key || '').toLowerCase();
    var n = Number(val);
    if ((k.includes('score') || k.includes('confidence')) && !isNaN(n)) {
        if (n >= 80) return 'badge-red';
        if (n >= 40) return 'badge-amber';
        return 'badge-teal';
    }
    if (k === 'reputation' && !isNaN(n)) {
        return n < -5 ? 'badge-red' : n < 0 ? 'badge-amber' : 'badge-teal';
    }
    if ((k === 'istor' || k === 'tor') && val === true) return 'badge-red';
    if ((k === 'vpn' || k === 'proxy') && val === true) return 'badge-amber';
    if (k.includes('bot') && val === true) return 'badge-amber';
    return null;
}
 
// ============================================================
// KV RENDERER — fully dynamic, renders any depth
// ============================================================
function renderKV(obj, depth) {
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return '';
    depth = depth || 0;
    var html = '';
 
    Object.entries(obj).forEach(function(entry) {
        var k = entry[0], v = entry[1];
        if (v === null || v === undefined || v === '') return;
 
        html += '<div class="kv">';
        html += '<div class="kv-k">' + esc(k) + '</div>';
 
        if (Array.isArray(v)) {
            if (v.length === 0) {
                html += '<div class="kv-v" style="color:#64748b">[ ]</div>';
            } else if (typeof v[0] === 'object' && v[0] !== null) {
                html += '<div class="kv-v" style="width:100%">';
                v.forEach(function(item, i) {
                    html += '<div class="nested">';
                    if (typeof item === 'object') {
                        html += renderKV(item, depth + 1);
                    } else {
                        html += '<span class="badge badge-gray">' + esc(String(item)) + '</span>';
                    }
                    html += '</div>';
                });
                html += '</div>';
            } else {
                html += '<div class="kv-v">';
                v.forEach(function(l) {
                    html += '<span class="badge ' + chipColor(String(l)) + '">' + esc(String(l)) + '</span> ';
                });
                html += '</div>';
            }
        } else if (typeof v === 'object' && v !== null) {
            html += '<div class="kv-v" style="width:100%"><div class="nested">';
            if (depth < 4) {
                html += renderKV(v, depth + 1);
            } else {
                html += '<span style="font-family:monospace;font-size:11px;color:#64748b">' + esc(JSON.stringify(v)) + '</span>';
            }
            html += '</div></div>';
        } else {
            var badge = scoreBadge(k, v);
            var str = esc(String(v));
            if (badge) {
                html += '<div class="kv-v"><span class="badge ' + badge + '">' + str + '</span></div>';
            } else if (typeof v === 'boolean') {
                html += '<div class="kv-v"><span class="badge ' + (v ? 'badge-teal' : 'badge-gray') + '">' + str + '</span></div>';
            } else {
                html += '<div class="kv-v">' + str + '</div>';
            }
        }
 
        html += '</div>';
    });
 
    return html;
}
 
// ============================================================
// RENDER ONE BUNDLE CARD
// ============================================================
function renderBundle(bundle, idx) {
    var objs      = bundle.objects || [];
    var ip        = objs.find(function(o){ return o.type === 'ipv4-addr'; });
    var net       = objs.find(function(o){ return o.type === 'network-traffic'; });
    var indicator = objs.find(function(o){ return o.type === 'indicator'; });
    var ta        = objs.find(function(o){ return o.type === 'threat-actor'; });
    var observed  = objs.find(function(o){ return o.type === 'observed-data'; });
    var notes     = objs.filter(function(o){ return o.type === 'note'; });
    var rels      = objs.filter(function(o){ return o.type === 'relationship'; });
 
    var ipVal  = (ip && ip.value) ? ip.value : '?';
    var ep     = (net && net.extensions && net.extensions['http-request-ext'])
                 ? net.extensions['http-request-ext'].request_value
                 : (indicator ? indicator.name : '?');
    var ts     = indicator ? indicator.created : '';
    var labels = indicator ? (indicator.labels || []) : [];
    var conf   = indicator ? (indicator.confidence || 0) : 0;
    var isHigh = conf >= 80;
    var dotColor = isHigh ? '#f87171' : labels.includes('tor-exit-node') ? '#fbbf24' : '#34d399';
 
    var cardId = 'bc_' + idx;
    var html = '<div class="item">';
 
    // Header
    html += '<div class="bundle-header" onclick="toggleBundle(\'' + cardId + '\')">';
    html += '<span style="width:8px;height:8px;border-radius:50%;background:' + dotColor + ';display:inline-block;flex-shrink:0"></span>';
    html += '<span style="font-weight:bold;color:#60a5fa">' + esc(ipVal) + '</span>';
    html += '<span style="color:#64748b">→</span>';
    html += '<span style="color:#93c5fd;font-size:12px">' + esc(ep || '') + '</span>';
    html += '<span style="flex:1"></span>';
    labels.slice(0,3).forEach(function(l){
        html += '<span class="badge ' + chipColor(l) + '">' + esc(l) + '</span>';
    });
    if (isHigh) html += '<span class="badge badge-red">HIGH</span>';
    html += '<span style="color:#64748b;font-size:11px;white-space:nowrap">' + esc(fmtTs(ts)) + '</span>';
    html += '<span class="arrow" id="arr_' + cardId + '">▶</span>';
    html += '</div>';
 
    // Body
    html += '<div class="bundle-body" id="' + cardId + '">';
 
    // IP
    if (ip) {
        html += '<div class="section-title">IP Address</div>';
        var ipFields = { value: ip.value };
        Object.entries(ip).forEach(function(e){
            if (e[0].startsWith('x_')) ipFields[e[0].replace('x_','')] = e[1];
        });
        html += renderKV(ipFields, 0);
    }
 
    // Request
    if (net) {
        html += '<div class="divider"></div><div class="section-title">HTTP Request</div>';
        var ext = (net.extensions && net.extensions['http-request-ext']) ? net.extensions['http-request-ext'] : {};
        var reqFields = {};
        if (ext.request_method) reqFields['method']   = ext.request_method;
        if (ext.request_value)  reqFields['endpoint'] = ext.request_value;
        var ua = ext.request_header && ext.request_header['User-Agent'];
        if (ua) reqFields['user-agent'] = ua;
        Object.entries(net).forEach(function(e){
            if (e[0].startsWith('x_') && e[1] !== null && e[1] !== undefined) {
                reqFields[e[0].replace('x_','')] = e[1];
            }
        });
        html += renderKV(reqFields, 0);
    }
 
    // Indicator
    if (indicator) {
        html += '<div class="divider"></div><div class="section-title">Indicator</div>';
        var skipInd = ['type','spec_version','id','created_by_ref','object_refs','name'];
        var indFields = {};
        Object.entries(indicator).forEach(function(e){
            if (skipInd.indexOf(e[0]) === -1) indFields[e[0]] = e[1];
        });
        html += renderKV(indFields, 0);
    }
 
    // Observed data
    if (observed) {
        html += '<div class="divider"></div><div class="section-title">Observed Data</div>';
        var skipObs = ['type','spec_version','id','created_by_ref','object_refs'];
        var obsFields = {};
        Object.entries(observed).forEach(function(e){
            if (skipObs.indexOf(e[0]) === -1) obsFields[e[0]] = e[1];
        });
        html += renderKV(obsFields, 0);
    }
 
    // Threat actor
    if (ta) {
        html += '<div class="divider"></div><div class="section-title">Threat Actor</div>';
        var skipTa = ['type','spec_version','id','created_by_ref'];
        var taFields = {};
        Object.entries(ta).forEach(function(e){
            if (skipTa.indexOf(e[0]) === -1) taFields[e[0]] = e[1];
        });
        html += renderKV(taFields, 0);
    }
 
    // Intel notes — ALL fields from ALL sources rendered dynamically
    if (notes.length > 0) {
        html += '<div class="divider"></div><div class="section-title">Intel Sources (' + notes.length + ')</div>';
        notes.forEach(function(note) {
            var src = note.abstract || (note.labels && note.labels[0]) || 'source';
            html += '<div class="intel-block">';
            html += '<div class="intel-title">' + esc(src) + '</div>';
 
            var parsed = null;
            try { parsed = JSON.parse(note.content); } catch(e) {}
 
            if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
                // Render every field that came from the intel source — nothing hardcoded
                html += renderKV(parsed, 0);
            } else if (note.content) {
                html += '<div class="mono">' + esc(note.content) + '</div>';
            }
 
            // Any extra custom fields on the note itself
            var extraSkip = ['type','spec_version','id','created','modified','created_by_ref','object_refs','abstract','content','labels'];
            Object.entries(note).forEach(function(e){
                if (extraSkip.indexOf(e[0]) === -1) {
                    html += '<div class="kv"><div class="kv-k">' + esc(e[0]) + '</div><div class="kv-v">' + esc(String(e[1])) + '</div></div>';
                }
            });
 
            html += '</div>';
        });
    }
 
    // Relationships
    if (rels.length > 0) {
        html += '<div class="divider"></div><div class="section-title">Relationships</div>';
        rels.forEach(function(rel) {
            var src = (rel.source_ref || '').split('--')[0];
            var tgt = (rel.target_ref || '').split('--')[0];
            html += '<div class="kv">';
            html += '<div class="kv-k">' + esc(rel.relationship_type || '') + '</div>';
            html += '<div class="kv-v" style="font-family:monospace;font-size:11px">' + esc(src) + ' → ' + esc(tgt) + '</div>';
            html += '</div>';
        });
    }
 
    html += '</div></div>';
    return html;
}
 
function toggleBundle(id) {
    var body = document.getElementById(id);
    var arr  = document.getElementById('arr_' + id);
    var open = body.classList.toggle('open');
    arr.classList.toggle('open', open);
}
 
// ============================================================
// FILTER
// ============================================================
function matchesFilter(bundle, f) {
    if (f === 'all') return true;
    var objs      = bundle.objects || [];
    var indicator = objs.find(function(o){ return o.type === 'indicator'; });
    var net       = objs.find(function(o){ return o.type === 'network-traffic'; });
    var labels    = indicator ? (indicator.labels || []) : [];
    var conf      = indicator ? (indicator.confidence || 0) : 0;
    if (f === 'high')    return conf >= 80;
    if (f === 'tor')     return labels.includes('tor-exit-node');
    if (f === 'vpn')     return labels.includes('vpn');
    if (f === 'scanner') return labels.includes('automated-scanner');
    if (f === 's3')      return labels.includes('cloud-storage-probe');
    if (f === 'config')  return labels.includes('config-exposure');
    if (f === 'cred')    return net && net.x_event_type === 'credential_misuse';
    return true;
}
 
function renderFilterBar() {
    document.getElementById('filterBar').innerHTML = FILTERS.map(function(f) {
        return '<button class="fbtn' + (f.k === activeFilter ? ' active' : '') + '" onclick="setFilter(\'' + f.k + '\')">' + esc(f.label) + '</button>';
    }).join('');
}
 
function setFilter(k) {
    activeFilter = k;
    renderFilterBar();
    applyFilter();
}
 
function applyFilter() {
    var filtered = allBundles.filter(function(b){ return matchesFilter(b, activeFilter); });
    var el = document.getElementById('listBundles');
    if (!filtered.length) {
        el.innerHTML = '<div class="item empty">No bundles match this filter</div>';
        return;
    }
    el.innerHTML = filtered.slice().reverse().map(function(b, i){ return renderBundle(b, i); }).join('');
}
 
// ============================================================
// BAR CHART
// ============================================================
function renderBar(containerId, data, colorFn) {
    var el = document.getElementById(containerId);
    var sorted = Object.entries(data).sort(function(a,b){ return b[1]-a[1]; }).slice(0,8);
    var max = sorted.length ? sorted[0][1] : 1;
    el.innerHTML = sorted.map(function(entry) {
        var label = entry[0], count = entry[1];
        var pct = Math.round((count/max)*100);
        return '<div class="bar-row">' +
            '<div class="bar-label" title="' + esc(label) + '">' + esc(label.length>18 ? label.slice(0,18)+'…' : label) + '</div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + colorFn(label) + '"></div></div>' +
            '<div class="bar-count">' + count + '</div>' +
        '</div>';
    }).join('');
}
 
// ============================================================
// MAIN LOAD + RENDER
// ============================================================
async function load() {
    try {
        var r = await fetch("CTI_Storage/CTI_STIX.json?t=" + Date.now());
        var data = await r.json();
        allBundles = Array.isArray(data) ? data : [data];
        render();
    } catch(err) {
        document.getElementById('subTitle').textContent =
            'Error: Could not load CTI_Storage/CTI_STIX.json — ' + err.message;
        console.error(err);
    }
}
 
function render() {
    var uniqueIPs = new Set();
    var highConf = 0, torVpn = 0;
    var endpointCounts = {}, countryCounts = {}, ipCounts = {};
 
    allBundles.forEach(function(b) {
        var objs      = b.objects || [];
        var ip        = objs.find(function(o){ return o.type === 'ipv4-addr'; });
        var net       = objs.find(function(o){ return o.type === 'network-traffic'; });
        var indicator = objs.find(function(o){ return o.type === 'indicator'; });
 
        if (ip && ip.value) {
            uniqueIPs.add(ip.value);
            ipCounts[ip.value] = (ipCounts[ip.value] || 0) + 1;
        }
 
        var conf = indicator ? (indicator.confidence || 0) : 0;
        if (conf >= 80) highConf++;
 
        var labels = indicator ? (indicator.labels || []) : [];
        if (labels.includes('tor-exit-node') || labels.includes('vpn')) torVpn++;
 
        var epRaw = (net && net.extensions && net.extensions['http-request-ext'])
                    ? net.extensions['http-request-ext'].request_value : 'unknown';
        var ep = (epRaw || 'unknown').split('/').filter(Boolean)[0] || 'unknown';
        // Friendly label for endpoint chart
        if (ep === 'api') ep = 'Admin token';
        endpointCounts[ep] = (endpointCounts[ep] || 0) + 1;
 
        var country = (ip && ip.x_country) ? ip.x_country : 'Unknown';
        countryCounts[country] = (countryCounts[country] || 0) + 1;
    });
 
    // Metrics
    document.getElementById('mTotal').textContent = allBundles.length;
    document.getElementById('mIPs').textContent   = uniqueIPs.size;
    document.getElementById('mHigh').textContent  = highConf;
    document.getElementById('mTor').textContent   = torVpn;
 
    var sortedIPs = Object.entries(ipCounts).sort(function(a,b){ return b[1]-a[1]; });
    document.getElementById('mTopIP').textContent = sortedIPs.length
        ? sortedIPs[0][0] + ' (' + sortedIPs[0][1] + 'x)' : '—';
 
    var sortedEPs = Object.entries(endpointCounts).sort(function(a,b){ return b[1]-a[1]; });
    document.getElementById('mTopEP').textContent = sortedEPs.length
        ? '/' + sortedEPs[0][0] + ' (' + sortedEPs[0][1] + 'x)' : '—';
 
    document.getElementById('subTitle').textContent =
        allBundles.length + ' bundle' + (allBundles.length !== 1 ? 's' : '') +
        ' loaded · auto-refresh every 10s · last: ' + fmtTs(new Date().toISOString());
 
    // Charts
    renderBar('chartEndpoint', endpointCounts, function(l) {
        return l.includes('s3') ? '#1D9E75' : l.includes('legacy') || l.includes('config') ? '#fbbf24' : '#a78bfa';
    });
    renderBar('chartCountry', countryCounts, function(){ return '#378ADD'; });
 
    // Top IPs list
    var ipEl = document.getElementById('listIPs');
    ipEl.innerHTML = sortedIPs.length
        ? sortedIPs.map(function(e){
            return '<div class="item"><span style="color:#60a5fa">' + esc(e[0]) + '</span>' +
                   ' <span style="color:#64748b">→ ' + e[1] + ' hit' + (e[1]!==1?'s':'') + '</span></div>';
          }).join('')
        : '<div class="item empty">No data yet</div>';
 
    // Timeline
    var tlEl = document.getElementById('listTimeline');
    tlEl.innerHTML = allBundles.slice().reverse().slice(0,15).map(function(b) {
        var objs      = b.objects || [];
        var ip        = objs.find(function(o){ return o.type === 'ipv4-addr'; });
        var net       = objs.find(function(o){ return o.type === 'network-traffic'; });
        var indicator = objs.find(function(o){ return o.type === 'indicator'; });
        var labels    = indicator ? (indicator.labels || []) : [];
        var ep        = (net && net.extensions && net.extensions['http-request-ext'])
                        ? net.extensions['http-request-ext'].request_value : '?';
        var isHigh    = indicator ? (indicator.confidence || 0) >= 80 : false;
        var dotColor  = isHigh ? '#f87171' : labels.includes('tor-exit-node') ? '#fbbf24' : '#34d399';
        return '<div class="item">' +
            '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:' + dotColor + ';margin-right:6px;vertical-align:middle"></span>' +
            '<span style="color:#94a3b8;font-size:11px">' + esc(fmtTs(indicator ? indicator.created : '')) + '</span><br>' +
            '<span style="color:#60a5fa">' + esc((ip && ip.value) ? ip.value : '?') + '</span>' +
            '<span style="color:#64748b"> → </span>' +
            '<span style="color:#93c5fd">' + esc(ep) + '</span>' +
            '<span style="color:#64748b;font-size:11px"> · ' + esc((ip && ip.x_country) ? ip.x_country : '?') + '</span><br>' +
            labels.slice(0,4).map(function(l){ return '<span class="badge ' + chipColor(l) + '">' + esc(l) + '</span>'; }).join('') +
        '</div>';
    }).join('');
 
    // Bundles
    renderFilterBar();
    applyFilter();
}
 
load();
setInterval(load, 10000);
</script>
</body>
</html>
