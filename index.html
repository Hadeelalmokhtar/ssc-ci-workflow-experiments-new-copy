<script>

async function load(){

let url = "https://hadeelalmokhtar.github.io/ssc-ci-workflow-experiments-new-copy/decoy_logs/latest.json?t=" + Date.now()

try{
    let res = await fetch(url)

    if(!res.ok){
        throw "pages failed"
    }

}catch{
    url = "https://raw.githubusercontent.com/hadeelalmokhtar/ssc-ci-workflow-experiments-new-copy/main/decoy_logs/latest.json?t=" + Date.now()
}

try{

const r = await fetch(url)

if(!r.ok){
throw new Error("Failed to load JSON")
}

const data = await r.json()

// CLEAR
["proc","fs","domains","dns","http","net","timeline"].forEach(id=>{
document.getElementById(id).innerHTML=""
})

// BASIC
document.getElementById("pkg").textContent = data.package || "No data"
document.getElementById("score").textContent = data.score ?? 0

// PROCESSES
if(!data.processes?.length){
document.getElementById("proc").innerHTML = "<div class='item'>No processes</div>"
}

(data.processes || []).forEach(p=>{
document.getElementById("proc").innerHTML += `<div class="item">${p}</div>`
})

// FILES
(data.files || []).forEach(f=>{
document.getElementById("fs").innerHTML += `<div class="item">${f}</div>`
})

// DOMAINS
(data.domains || []).forEach(d=>{
document.getElementById("domains").innerHTML += `<div class="item">${d}</div>`
})

// DNS
(data.dns || []).forEach(d=>{
document.getElementById("dns").innerHTML += `<div class="item">${d}</div>`
})

// HTTP
(data.http_requests || []).forEach(h=>{
document.getElementById("http").innerHTML +=
`<div class="item">${h.method} → ${h.path}</div>`
})

// NETWORK
(data.network_details || []).forEach(n=>{
document.getElementById("net").innerHTML += `
<div class="item">
IP: ${n.ip}<br>
Country: ${n.country || "-"}<br>
ISP: ${n.isp || "-"}<br>
Org: ${n.org || "-"}
</div>`
})

// TIMELINE
(data.timeline || []).forEach(t=>{
document.getElementById("timeline").innerHTML +=
`<div class="item">[${t.time}s] → ${t.event}</div>`
})

// GRAPH
let nodes=[]
let edges=[]
let id=1

nodes.push({id:id,label:"Package"})
let root=id

;(data.processes || []).forEach(p=>{
id++
nodes.push({id:id,label:p})
edges.push({from:root,to:id})
})

;(data.domains || []).forEach(d=>{
id++
nodes.push({id:id,label:d})
edges.push({from:root,to:id})
})

new vis.Network(
document.getElementById("graph"),
{nodes:new vis.DataSet(nodes),edges:new vis.DataSet(edges)},
{}
)

}catch(e){
console.error(e)
alert("❌ Failed to load data from BOTH sources")
}

}

load()

</script>
