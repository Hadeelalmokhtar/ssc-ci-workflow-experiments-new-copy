<script>

function safeSet(id, html){
const el = document.getElementById(id)
if(el){
el.innerHTML += html
}
}

function safeClear(id){
const el = document.getElementById(id)
if(el){
el.innerHTML = ""
}
}

function isRealDomain(d){
if(!d) return false
const blacklist = [".js",".so",".json",".node",".bundle",".length",".position"]
if(blacklist.some(x=>d.includes(x))) return false
return /^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$/.test(d)
}

async function load(){

const url = "https://raw.githubusercontent.com/hadeelalmokhtar/ssc-ci-workflow-experiments-new-copy/main/decoy_logs/latest.json?cache=" + Date.now()

try{

const r = await fetch(url, {cache:"no-store"})

if(!r.ok){
throw new Error("HTTP " + r.status)
}

const data = JSON.parse(await r.text())

// CLEAR SAFE
["proc","fs","domains","dns","http","net","timeline"].forEach(safeClear)

// BASIC
const pkg = document.getElementById("pkg")
if(pkg) pkg.textContent = data.package || "-"

const score = document.getElementById("score")
if(score) score.textContent = data.score ?? 0

// PROCESSES
(data.processes || []).forEach(p=>{
safeSet("proc", `<div class="item">${p}</div>`)
})

// FILES
(data.files || []).forEach(f=>{
safeSet("fs", `<div class="item">${f}</div>`)
})

// DOMAINS
const cleanDomains = (data.domains || []).filter(isRealDomain)

cleanDomains.forEach(d=>{
safeSet("domains", `<div class="item">${d}</div>`)
})

// DNS
(data.dns || []).forEach(d=>{
safeSet("dns", `<div class="item">${d}</div>`)
})

// HTTP
(data.http_requests || []).forEach(h=>{
safeSet("http", `<div class="item">${h.method} → ${h.path}</div>`)
})

// NETWORK
(data.network_details || []).forEach(n=>{
safeSet("net", `
<div class="item">
IP: ${n.ip}<br>
Country: ${n.country || "-"}<br>
ISP: ${n.isp || "-"}
</div>`)
})

// TIMELINE
(data.timeline || []).forEach(t=>{
safeSet("timeline", `<div class="item">[${t.time}s] → ${t.event}</div>`)
})

const graphEl = document.getElementById("graph")

if(graphEl){

let nodes=[]
let edges=[]
let id=1

nodes.push({id:id,label:"Package"})
let root=id

(data.processes || []).forEach(p=>{
id++
nodes.push({id:id,label:p})
edges.push({from:root,to:id})
})

cleanDomains.forEach(d=>{
id++
nodes.push({id:id,label:d})
edges.push({from:root,to:id})
})

new vis.Network(
graphEl,
{nodes:new vis.DataSet(nodes),edges:new vis.DataSet(edges)},
{}
)

}

}catch(e){
console.error("❌ ERROR:", e)
}

}

load()
</script>
