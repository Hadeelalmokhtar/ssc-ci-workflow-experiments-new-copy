<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Decoy System — Threat Intelligence Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/vis-network.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/styles/vis-network.min.css" rel="stylesheet">

<style>
body{
  background:#060b14;
  color:#c8daf0;
  font-family:'Rajdhani',sans-serif;
}

.card{
  background:#111b2e;
  border:1px solid #1e3050;
  border-radius:10px;
  padding:18px;
  margin-bottom:15px;
}

#graph-container{
  height:420px;
  border:1px solid #1e3050;
}
</style>
</head>

<body>

<h2 style="color:#00d4ff">Decoy Threat Intelligence Dashboard</h2>

<div class="card">
  <h3>Verdict: <span id="verdict"></span></h3>
  <p>Score: <span id="score"></span></p>
</div>

<div class="card">
  <h3>Processes</h3>
  <div id="proc-list"></div>
</div>

<div class="card">
  <h3>Domains</h3>
  <div id="domains-list"></div>
</div>

<div class="card">
  <h3>Attack Graph</h3>
  <div id="graph-container"></div>
</div>

<script>

/* ===== UTIL ===== */
function el(id){ return document.getElementById(id) }

function renderList(id, arr){
  const div = el(id)
  div.innerHTML = ''
  if(!arr || !arr.length){
    div.innerHTML = 'No data'
    return
  }
  arr.forEach(i=>{
    div.innerHTML += `<div>${i}</div>`
  })
}

/* ===== NEW GRAPH (FINAL VERSION) ===== */
function renderGraph(data){

  if(!data.attack_graph){
    document.getElementById("graph-container").innerHTML = "No graph data"
    return
  }

  const nodes = new vis.DataSet(data.attack_graph.nodes.map(n => {
    let color = '#00d4ff'

    if(n.type === 'process') color = '#ff4e6a'
    if(n.type === 'domain')  color = '#f5c400'
    if(n.type === 'ip')      color = '#ff8c42'
    if(n.type === 'honey')   color = '#ff0000'

    return {
      id: n.id,
      label: n.label,
      color: {
        background: '#111',
        border: color
      },
      font: {color}
    }
  }))

  const edges = new vis.DataSet(data.attack_graph.edges)

  new vis.Network(
    document.getElementById("graph-container"),
    {nodes, edges},
    {
      physics: {
        enabled: true,
        stabilization: false
      },
      edges: {
        arrows: "to"
      }
    }
  )
}

/* ===== LOAD DATA ===== */
async function load(){
  try{
    const r = await fetch("decoy_logs/latest.json?t="+Date.now())
    const data = await r.json()

    el("verdict").textContent = data.verdict
    el("score").textContent   = data.score

    renderList("proc-list", data.processes)
    renderList("domains-list", data.domains)

    renderGraph(data)

  }catch(e){
    console.error("Error loading dashboard:", e)
  }
}

/* ===== AUTO REFRESH ===== */
load()
setInterval(load, 50000)

</script>

</body>
</html>
