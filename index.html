<script>

async function load(){

try{

const url = "https://raw.githubusercontent.com/hadeelalmokhtar/ssc-ci-workflow-experiments-new-copy/main/decoy_logs/latest.json"

const res = await fetch(url)

if(!res.ok){
throw new Error("fetch failed")
}

const data = await res.json()

// CLEAR
["proc","fs","dns","net","timeline"].forEach(id=>{
document.getElementById(id).innerHTML=""
})

// BASIC
document.getElementById("pkg").textContent = data.package || "-"
document.getElementById("score").textContent = data.score ?? 0

// ✅ PROCESSES (تم التعديل)
(data.processes || []).forEach(p=>{
document.getElementById("proc").innerHTML += `<div class="item">${p}</div>`
})

// ✅ FILES
(data.files || []).forEach(f=>{
document.getElementById("fs").innerHTML += `<div class="item">${f}</div>`
})

// ✅ DNS
(data.dns || []).forEach(d=>{
document.getElementById("dns").innerHTML += `<div class="item">${d}</div>`
})

// ✅ NETWORK
(data.network_details || []).forEach(n=>{
document.getElementById("net").innerHTML += `
<div class="item">
IP: ${n.ip}<br>
Country: ${n.country || "-"}<br>
ISP: ${n.isp || "-"}
</div>`
})

// ✅ TIMELINE (هذا صحيح عندك أصلاً)
(data.timeline || []).forEach(t=>{
document.getElementById("timeline").innerHTML +=
`<div class="item">[${t.time}s] → ${t.event}</div>`
})

}catch(e){
console.error(e)
alert("❌ Failed to load JSON")
}

}

load()

</script>
