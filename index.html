<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>SSC Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/vis-network.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/vis-network/styles/vis-network.min.css" rel="stylesheet">

<style>
body{background:#0f172a;color:white;font-family:Arial;padding:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px}
.card{background:#1e293b;padding:20px;border-radius:12px}
.title{font-size:14px;opacity:0.7;margin-bottom:8px}
.big{font-size:22px;font-weight:bold}
.list{background:#0b1220;padding:10px;border-radius:8px;max-height:250px;overflow:auto}
.item{padding:6px;border-bottom:1px solid #333}
</style>

</head>

<body>

<h1>🔥 Decoy System Dashboard</h1>

<div class="grid">

<div class="card"><div class="title">Package</div><div id="pkg" class="big"></div></div>
<div class="card"><div class="title">Threat Score</div><div id="score" class="big"></div></div>

<div class="card"><div class="title">Processes</div><div id="proc" class="list"></div></div>
<div class="card"><div class="title">Filesystem</div><div id="fs" class="list"></div></div>
<div class="card"><div class="title">Domains</div><div id="domains" class="list"></div></div>
<div class="card"><div class="title">DNS</div><div id="dns" class="list"></div></div>
<div class="card"><div class="title">HTTP</div><div id="http" class="list"></div></div>
<div class="card"><div class="title">Network</div><div id="net" class="list"></div></div>
<div class="card"><div class="title">Timeline</div><div id="timeline" class="list"></div></div>

<div class="card">
<div class="title">Attack Graph</div>
<div id="graph" style="height:300px"></div>
</div>

</div>

<script>

function safeSet(id, html){
const el = document.getElementById(id)
if(el) el.innerHTML += html
}

function safeClear(id){
const el = document.getElementById(id)
if(el) el.innerHTML = ""
}

async function load(){

const url = "https://hadeelalmokhtar.github.io/ssc-ci-workflow-experiments-new-copy/decoy_logs/latest.json?cache=" + Date.now()

try{

const r = await fetch(url)

if(!r.ok){
throw new Error("HTTP " + r.status)
}

let data = {}

try{
data = await r.json()
}catch(e){
console.error("JSON error", e)
return
}

if(!data || typeof data !== "object"){
console.error("Invalid data")
return
}

console.log("DATA:", data)

// CLEAR
["proc","fs","domains","dns","http","net","timeline"].forEach(safeClear)

// BASIC
document.getElementById("pkg").textContent = data.package || "-"
document.getElementById("score").textContent = data.score ?? 0

// PROCESSES
if(Array.isArray(data.processes)){
data.processes.forEach(p=>{
safeSet("proc", `<div class="item">${p}</div>`)
})
}else{
safeSet("proc","<div class='item'>No processes</div>")
}

// FILES
if(Array.isArray(data.files)){
data.files.forEach(f=>{
safeSet("fs", `<div class="item">${f}</div>`)
})
}else{
safeSet("fs","<div class='item'>No files</div>")
}

// DOMAINS
if(Array.isArray(data.domains)){
data.domains.forEach(d=>{
safeSet("domains", `<div class="item">${d}</div>`)
})
}else{
safeSet("domains","<div class='item'>No domains</div>")
}

// DNS
if(Array.isArray(data.dns)){
data.dns.forEach(d=>{
safeSet("dns", `<div class="item">${d}</div>`)
})
}else{
safeSet("dns","<div class='item'>No DNS</div>")
}

// HTTP
if(Array.isArray(data.http_requests)){
data.http_requests.forEach(h=>{
safeSet("http", `<div class="item">${h.method} → ${h.path}</div>`)
})
}else{
safeSet("http","<div class='item'>No HTTP</div>")
}

// NETWORK
if(Array.isArray(data.network_details)){
data.network_details.forEach(n=>{
safeSet("net", `
<div class="item">
IP: ${n.ip || "-"}<br>
Country: ${n.country || "-"}
</div>`)
})
}else{
safeSet("net","<div class='item'>No network</div>")
}

// TIMELINE (🔥 FIX النهائي)
if(Array.isArray(data.timeline)){
data.timeline.forEach(t=>{
safeSet("timeline", `<div class="item">[${t.time || 0}s] → ${t.event || "-"}</div>`)
})
}else{
safeSet("timeline","<div class='item'>No timeline</div>")
}

// GRAPH
const graphEl = document.getElementById("graph")

if(graphEl){

let nodes=[]
let edges=[]
let id=1

nodes.push({id:id,label:"Package"})
let root=id

if(Array.isArray(data.processes)){
data.processes.forEach(p=>{
id++
nodes.push({id:id,label:p})
edges.push({from:root,to:id})
})
}

if(Array.isArray(data.domains)){
data.domains.forEach(d=>{
id++
nodes.push({id:id,label:d})
edges.push({from:root,to:id})
})
}

new vis.Network(graphEl,{
nodes:new vis.DataSet(nodes),
edges:new vis.DataSet(edges)
},{})
}

console.log("✅ Dashboard Working")

}catch(e){
console.error("ERROR:", e)
alert("Error: " + e.message)
}

}

window.addEventListener("DOMContentLoaded", ()=>{
load()
setInterval(load, 5000)
})

</script>

</body>
</html>
